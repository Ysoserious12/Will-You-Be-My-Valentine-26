<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Valentine 🖤</title>
    <link rel="stylesheet" href="assets/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="particles-container" id="particles"></div>

<div class="container">
    <div class="envelope-wrapper">
        <div class="envelope" id="envelope">
            <div class="flap"></div>
            <div class="paper">
                <div class="content">
                    <h2 class="romantic-text">Will you be my Valentine?</h2>
                    <p class="sub-text">You are my favorite dark magic... ✨</p>
                    <div class="buttons">
                        <button id="yes">Yes ❤️</button>
                        <button id="no">No</button>
                    </div>
                </div>
            </div>
            <div class="seal" id="seal">🌹</div>
        </div>
    </div>
</div>

<script src="assets/script.js"></script>
</body>
</html>
